name: "Guardian Container Image: Push"
description: "Tag and push a Docker image to AWS ECR and return its image digest."
inputs:
  roleArn:
    description: "The ARN of the role to assume to push the image."
    required: true
  appName:
    description: "The app name, appended to the ECR image repository. Typically the name of the GitHub repository, when not a multi-app GitHub repository."
    required: true
  githubToken:
    description: "A GitHub token scoped to allow pull request commenting"
    required: true
outputs:
  imageDigest:
    description: "The immutable digest of the pushed image."
    value: ${{ steps.obtain-image-details.outputs.imageDigest }}
  imageUri:
    description: "The URI of the image."
    value: ${{ steps.obtain-image-details.outputs.imageUri }}
runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        APP_NAME: ${{ inputs.appName }}
        ROLE_ARN: ${{ inputs.roleArn }}
      run: |
        if [[ -z "$APP_NAME" ]]; then
          echo "appName is required and must not be empty."
          exit 1
        fi
        
        if [[ -z "ROLE_ARN" ]]; then
          echo "roleArn is required and must not be empty."
          exit 1
        fi

    - name: Determine ECR repository and branch name
      id: determine-repository
      shell: bash
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        RAW_BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref || 'unknown' }}
        APP_NAME: ${{ inputs.appName }}
      run: |
        # Remove "refs/heads/" prefix
        TRIMMED_BRANCH_NAME="${RAW_BRANCH_NAME#refs/heads/}"

        # Replace '/' with '-' for ECR compatibility
        SAFE_BRANCH_NAME=${TRIMMED_BRANCH_NAME//\//-}

        IMAGE_REPOSITORY=$GITHUB_REPOSITORY/$APP_NAME

        echo "appName=${APP_NAME}" >> $GITHUB_OUTPUT
        echo "safeBranchName=${SAFE_BRANCH_NAME}" >> $GITHUB_OUTPUT
        echo "imageRepository=${IMAGE_REPOSITORY}" >> $GITHUB_OUTPUT

    - name: Find local source image
      id: find-source-image
      shell: bash
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        APP_NAME: ${{ steps.determine-repository.outputs.appName }}
      run: |
        # Look for a local image under the app name repository (e.g. built with `docker build -t <app name> .`)
        # or the `guardian/<app name>` repository (e.g. built with `docker build -t ${{ github.repository }} .`),
        # regardless of tag. Fail if more than one image is found across both repositories, since it's then
        # ambiguous which to publish.
        mapfile -t MATCHING_IMAGES < <(
          docker images --format '{{.Repository}}:{{.Tag}}' "$APP_NAME"
          docker images --format '{{.Repository}}:{{.Tag}}' "$GITHUB_REPOSITORY"
        )

        if [[ ${#MATCHING_IMAGES[@]} -gt 1 ]]; then
          echo "Found multiple images under $APP_NAME and/or $GITHUB_REPOSITORY. Expected exactly one but found:" >&2
          printf '%s\n' "${MATCHING_IMAGES[@]}" >&2
          exit 1
        elif [[ ${#MATCHING_IMAGES[@]} -eq 1 ]]; then
          SOURCE_IMAGE="${MATCHING_IMAGES[0]}"
        else
          echo "No image found under $APP_NAME or $GITHUB_REPOSITORY." >&2
          echo "Ensure that your docker image is named either \`$APP_NAME\` or \`$GITHUB_REPOSITORY\`." >&2
          echo "If you're using \`docker buildx\` try the following format: \`docker buildx build -t $APP_NAME .\` or \`docker buildx build -t ${{ '\${{ github.repository }}' }}\`." >&2
          exit 1
        fi

        echo "sourceImage=${SOURCE_IMAGE}" >> $GITHUB_OUTPUT

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        role-to-assume: ${{ inputs.roleArn }}
        aws-region: eu-west-1
        mask-aws-account-id: 'true'

    - name: Login to AWS ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2.1.7
      with:
        mask-password: 'true'

    # Ideally, this Action is used in an isolated job, so that the AWS credentials (stored in environment variables) are not available to any other jobs.
    # However, if this Action is used in a job that has other steps, clear the AWS credentials from the environment at the end of the job to avoid leaking them to any subsequent steps.
    # See https://github.com/aws-actions/configure-aws-credentials/issues/1308.
    - name: Clear AWS credentials
      if: always()
      shell: bash
      run: |
        echo "AWS_ACCESS_KEY_ID=''" >>"$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=''" >>"$GITHUB_ENV"
        echo "AWS_SESSION_TOKEN=''" >>"$GITHUB_ENV"
        echo "AWS_DEFAULT_REGION=''" >>"$GITHUB_ENV"
        echo "AWS_REGION=''" >>"$GITHUB_ENV"

    - name: Tag image
      id: tag-image
      shell: bash
      env:
        SOURCE_IMAGE: ${{ steps.find-source-image.outputs.sourceImage }}
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_REPOSITORY: ${{ steps.determine-repository.outputs.imageRepository }}
        BRANCH_NAME: ${{ steps.determine-repository.outputs.safeBranchName }}
        BUILD_NUMBER: ${{ github.run_number }}
      run: |
        docker image tag $SOURCE_IMAGE $REGISTRY/$IMAGE_REPOSITORY:branch-$BRANCH_NAME
        docker image tag $SOURCE_IMAGE $REGISTRY/$IMAGE_REPOSITORY:build-$BUILD_NUMBER
        docker image tag $SOURCE_IMAGE $REGISTRY/$IMAGE_REPOSITORY:lifecycle-$BRANCH_NAME-$BUILD_NUMBER

    - name: Push image to AWS ECR
      shell: bash
      env:
        IMAGE_REPOSITORY: ${{ steps.determine-repository.outputs.imageRepository }}
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: docker push $REGISTRY/$IMAGE_REPOSITORY --all-tags

    - name: Obtain image details
      id: obtain-image-details
      shell: bash
      env:
        IMAGE_REPOSITORY: ${{ steps.determine-repository.outputs.imageRepository }}
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        BUILD_NUMBER: ${{ github.run_number }}
      run: |
        IMAGE_DIGEST=$(docker manifest inspect $REGISTRY/$IMAGE_REPOSITORY:build-$BUILD_NUMBER --verbose | jq -r '.Descriptor.digest')
        echo "imageDigest=${IMAGE_DIGEST}" >> $GITHUB_OUTPUT
        
        IMAGE_URI="$REGISTRY/$IMAGE_REPOSITORY@$IMAGE_DIGEST"
        echo "imageUri=${IMAGE_URI}" >> $GITHUB_OUTPUT

    - uses: actions/github-script@v9
      env:
        IMAGE_REPOSITORY: ${{ steps.determine-repository.outputs.imageRepository }}
        IMAGE_DIGEST: ${{ steps.obtain-image-details.outputs.imageDigest }}
        SAFE_BRANCH_NAME: ${{ steps.determine-repository.outputs.safeBranchName }}
        BUILD_NUMBER: ${{ github.run_number }}
        COMMIT_SHA: ${{ github.sha }}
      with:
        github-token: ${{ inputs.githubToken }}
        script: |
          const path = require('node:path');
          const codePath = path.join(process.env.GITHUB_ACTION_PATH, 'pr-comment.ts');
          return await require(codePath).main({ core, context, github });
